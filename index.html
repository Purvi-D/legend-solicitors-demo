<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Solicitors - Floating Chatbot Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            color: #1f2937;
        }
        header {
            background-color: #0F294A;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h2>LEGEND SOLICITORS (Demo Site)</h2>
        <span>Home | Immigration | Property | Contact</span>
    </header>

    <div class="hero">
        <h1>Expert UK Immigration &amp; Legal Advice</h1>
        <p>Browse our website normally—click the <strong>Legal Assistant</strong> bubble in the bottom-right corner whenever you need help.</p>
    </div>

<!-- =========================================================
     LEGEND SOLICITORS — FLOATING CHAT WIDGET EMBED
     Paste right before </body> on the site template.
     ========================================================= -->
<style>
  :root {
    --ls-navy: #0F294A;
    --ls-navy-hover: #173B6A;
    --ls-gold: #FBBF24;
    --ls-z: 999999;
  }

  #ls-chat-launcher {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: var(--ls-z);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border: 2px solid var(--ls-gold);
    border-radius: 999px;
    background-color: var(--ls-navy);
    color: #FFFFFF;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(15, 41, 74, 0.28);
    transition: transform 0.18s ease, background-color 0.18s ease;
  }

  #ls-chat-launcher:hover {
    background-color: var(--ls-navy-hover);
    transform: translateY(-2px);
  }

  #ls-chat-launcher:focus-visible {
    outline: 3px solid var(--ls-gold);
    outline-offset: 2px;
  }

  #ls-chat-panel {
    position: fixed;
    right: 20px;
    bottom: 84px;
    z-index: var(--ls-z);
    width: min(410px, calc(100vw - 32px));
    height: min(640px, calc(100vh - 110px));
    display: none;
    flex-direction: column;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid rgba(15, 41, 74, 0.18);
    background-color: #FFFFFF;
    box-shadow: 0 18px 45px rgba(15, 41, 74, 0.25);
  }

  #ls-chat-panel.is-open {
    display: flex;
  }

  #ls-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background-color: var(--ls-navy);
    color: #FFFFFF;
    border-bottom: 2px solid var(--ls-gold);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #ls-chat-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  #ls-chat-close {
    border: none;
    background: transparent;
    color: #FFFFFF;
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    cursor: pointer;
  }

  #ls-chat-close:hover {
    background-color: rgba(255, 255, 255, 0.14);
    color: var(--ls-gold);
  }

  #ls-chat-iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: 0;
    background-color: #FFFFFF;
  }

  @media (max-width: 480px) {
    #ls-chat-launcher {
      right: 14px;
      bottom: 14px;
      padding: 11px 15px;
    }

    #ls-chat-panel {
      right: 12px;
      bottom: 72px;
      width: calc(100vw - 24px);
      height: calc(100vh - 92px);
    }
  }
</style>

<button
  id="ls-chat-launcher"
  type="button"
  aria-expanded="false"
  aria-controls="ls-chat-panel"
>
  <span aria-hidden="true">⚖️</span>
  <span>Legal Assistant</span>
</button>

<section
  id="ls-chat-panel"
  role="dialog"
  aria-label="Legend Solicitors Virtual Legal Assistant"
>
  <div id="ls-chat-header">
    <span id="ls-chat-title">Legend Solicitors Assistant</span>
    <button id="ls-chat-close" type="button" aria-label="Close chat assistant">
      &times;
    </button>
  </div>

  <iframe
    id="ls-chat-iframe"
    data-src="https://solicitors-chatbot-mjy7xmqwza5msfnyejwar7.streamlit.app/?embed=true"
    title="Legend Solicitors Virtual Legal Assistant"
    allow="clipboard-write"
  ></iframe>
</section>

<script>
  (function () {
    const launcher = document.getElementById("ls-chat-launcher");
    const panel = document.getElementById("ls-chat-panel");
    const closeBtn = document.getElementById("ls-chat-close");
    const iframe = document.getElementById("ls-chat-iframe");

    function setOpen(open) {
      if (open && !iframe.getAttribute("src")) {
        iframe.setAttribute("src", iframe.getAttribute("data-src"));
      }
      panel.classList.toggle("is-open", open);
      launcher.setAttribute("aria-expanded", String(open));
      if (open) {
        closeBtn.focus();
      } else {
        launcher.focus();
      }
    }

    launcher.addEventListener("click", function () {
      const isOpen = panel.classList.contains("is-open");
      setOpen(!isOpen);
    });

    closeBtn.addEventListener("click", function () {
      setOpen(false);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && panel.classList.contains("is-open")) {
        setOpen(false);
      }
    });
  })();
</script>

</body>
</html>
